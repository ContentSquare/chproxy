version: "2"

run:
  timeout: 3m
  tests: false

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - forcetypeassert
    - fatcontext
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    # gosimple is merged into staticcheck in v2, only its checks (S*) are enabled below
    - staticcheck
    - testpackage
    - thelper
    - tparallel
    - unused
    - wastedassign
    - whitespace
  disable:
    # Should be readded in the future with a dedicated PR to do the fix
    - funlen
    - gocognit
    - nestif
    - nolintlint
    - revive
    - unconvert
    - unparam

    # Disabled with a reason
    - canonicalheader # Clickhouse uses non-canonical header
    - depguard # Way too spammy and forces whitelist of all imports
    - gochecknoglobals # incompatible with the way we define our flags currently
    - noctx # disabled because we do not plan to distribute this code as a library
    - prealloc # we are not after some perf
    - tagliatelle # disabled because we are dependant on external API that do not follow the right naming
  settings:
    goconst:
      # Prometheus label names are repeated in every metric definition
      ignore-string-values:
        - ^(user|cluster|cluster_user|cluster_node|replica|cache|code)$
    gosec:
      excludes:
        - G115 # Unsafe cast of ints. Needs to be looked at by a dedicated PR
    staticcheck:
      # Only the former gosimple checks, the rest of staticcheck and stylecheck
      # should be readded in the future with a dedicated PR to do the fix
      checks:
        - S*
  exclusions:
    generated: lax
    # Keep the default exclusions of golangci-lint v1
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
